name: Push Tag Example

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  tag-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Tag and push with PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag test-tag-$(date +%s)
          git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git --tags
